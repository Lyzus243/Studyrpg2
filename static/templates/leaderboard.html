<!DOCTYPE html>
<html lang="en">
<head>
<style id="discord-theme-override">
:root{
  --bg: #0b0d10;        /* primary background (near-black) */
  --panel: #111216;     /* panels and cards */
  --accent: #5865F2;    /* Discord blurple */
  --text: #DCDDDE;      /* main text */
  --muted: #72767D;     /* muted text */
  --border: rgba(255,255,255,0.06);
}

html,body {
  background: var(--bg) !important;
  color: var(--text) !important;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif !important;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100%;
}

/* Make primary containers dark panels */
header, nav, footer, .navbar, .header, .topbar, .app-bar, .panel, .card, .container, .box {
  background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)) , var(--panel) !important;
  color: var(--text) !important;
  border: 1px solid var(--border) !important;
}

/* Links and accents */
a, a:link, a:visited, .link, .accent {
  color: var(--accent) !important;
  text-decoration: none !important;
}

/* Buttons and interactive elements */
button, .btn, .button, input[type="button"], input[type="submit"] {
  background: rgba(88,101,242,0.95) !important;
  color: #ffffff !important;
  border: none !important;
  box-shadow: 0 1px 0 rgba(0,0,0,0.3) inset !important;
  border-radius: 6px !important;
}

/* Outline / secondary buttons */
button.secondary, .btn-secondary, .button.secondary {
  background: transparent !important;
  color: var(--text) !important;
  border: 1px solid var(--border) !important;
}

/* Inputs */
input, textarea, select, .form-control {
  background: #0f1113 !important;
  color: var(--text) !important;
  border: 1px solid rgba(255,255,255,0.04) !important;
}

/* Cards and panels */
.card, .panel {
  background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)) , var(--panel) !important;
  border-radius: 8px !important;
  padding: 12px !important;
}

/* Tables */
table {
  color: var(--text) !important;
}
table thead th {
  color: var(--muted) !important;
  border-bottom: 1px solid var(--border) !important;
}

/* Scrollbar (modern browsers) */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 10px; }

/* Utility muted text */
.muted, .text-muted, small {
  color: var(--muted) !important;
}

/* Ensure images that used light backgrounds remain visible */
img {
  filter: none !important;
}

/* Fallback stronger override for inline styles and components */
[style*="background"], [style*="background-color"] {
  background-color: unset !important;
}

</style>

  <meta charset="UTF-8">
  <title>Leaderboard</title>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(
    135deg,
    #1a1a2e 0%,       /* Deep night (mystery/quests) */
    #1e3c72 25%,      /* Steel blue (survival/cold tech) */
    #e52d27 60%,      /* Blood red (danger/battle) */
    #ffb347 85%,      /* Ember glow (energy/climax) */
    #6df0ff 100%      /* Cyber neon (tech/futurism) */
);
background-size: 400% 400%;
animation: gradientPulse 15s ease infinite;
      padding: 2rem;
    }

    @media (max-width: 600px) {
  table {
    width: 100%;
    font-size: 0.9rem;
  }

  th, td {
    padding: 0.5rem;
  }
}

    h1 {
      text-align: center;
      color: white;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 80%;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 1rem;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #007BFF;
      color: white;
    }
    
    #error-message {
      color: red;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>Top Scholars</h1>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Username</th>
        <th>Level</th>
        <th>XP</th>
      </tr>
    </thead>
    <tbody id="leaderboard"></tbody>
  </table>

  <div id="loading-spinner" style="text-align: center;">
    <img src="/static/images/loading-spinner.gif" alt="Loading..." />
  </div>
  
  <div id="error-message"></div>

<script>
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadLeaderboard() {
      const loadingSpinner = document.getElementById('loading-spinner');
      const errorMessage = document.getElementById('error-message');
      const table = document.getElementById('leaderboard');
      
      loadingSpinner.style.display = 'block';
      errorMessage.textContent = '';
      table.innerHTML = '';

      try {
        const response = await fetch('/leaderboard-data');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const users = await response.json();
        
        if (!Array.isArray(users)) {
          throw new Error('Invalid data format');
        }

        users.forEach((user) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${user.rank}</td>
            <td>${escapeHtml(user.username)}</td>
            <td>${user.level}</td>
            <td>${user.xp}</td>
          `;
          table.appendChild(row);
        });

      } catch (error) {
        errorMessage.textContent = `Failed to load leaderboard: ${escapeHtml(error.message)}`;
        console.error('Leaderboard load error:', error);
      } finally {
        loadingSpinner.style.display = 'none';
      }
    }

    window.onload = loadLeaderboard;
  </script>
</body>
</html>
